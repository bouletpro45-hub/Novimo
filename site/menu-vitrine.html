<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu vitrine</title>
<link rel="stylesheet" href="commun/studio.css">

<!-- =======================================================
     🎛️  RÉGLAGES — "La carte" : un menu façon écran de vitrine,
     format paysage 16:9 (TV en boutique, YouTube). 13 secondes.
     ======================================================= -->
<script>
const REGLAGES = {
  titrePage: 'Menu vitrine — Novimo',
  formats: ['paysage'],            // pensé pour un écran 16:9 (1920 × 1080)

  surTitre: 'La carte',
  marque: 'Novimo',
  phrase: 'Motion design pour les marques et les entreprises.',
  pastille: 'Moitié prix d\'un freelance',

  // La carte : nom, petit détail, prix en euros (nombre entier), "dès" si c'est un prix de départ
  carte: [
    { nom: 'Logo animé',     detail: '4 secondes, carré + vertical', prix: 297,  des: false },
    { nom: 'Petite pub',     detail: '8 secondes pour les Reels',    prix: 147,  des: false },
    { nom: 'Pack lancement', detail: 'Logo animé + petite pub',      prix: 389,  des: false },
    { nom: 'Spot 30 s',      detail: 'YouTube, TV, vitrine',         prix: 743,  des: true },
    { nom: 'Spot 60 s',      detail: 'La version longue',            prix: 1487, des: true }
  ],

  // Le bandeau qui défile en bas
  bandeau: ['Devis gratuit en une minute', 'Aperçu en 48 h', 'Carré, vertical, 16:9', '@novimo_md'],

  motDes: 'dès',                  // le petit mot devant un prix de départ
  devise: '€',                    // le symbole de la monnaie
  euroAvant: false,               // true = « $337 » (anglais), false = « 297 € »

  // 🇬🇧 Version anglaise (utilisée sur le site anglais, avec ?langue=en dans l'adresse)
  en: {
    surTitre: 'The menu',
    phrase: 'Motion design for brands and businesses.',
    pastille: 'Half the price of a freelancer',
    carte: [
      { nom: 'Animated logo', detail: '4 seconds, square + vertical', prix: 337,  des: false },
      { nom: 'Short ad',      detail: '8 seconds for Reels',          prix: 167,  des: false },
      { nom: 'Launch pack',   detail: 'Animated logo + short ad',     prix: 447,  des: false },
      { nom: '30 s spot',     detail: 'YouTube, TV, shop window',     prix: 857,  des: true },
      { nom: '60 s spot',     detail: 'The long version',             prix: 1697, des: true }
    ],
    bandeau: ['Free quote in one minute', 'Preview in 48 h', 'Square, vertical, 16:9', '@novimo_md'],
    motDes: 'from',
    devise: '$',
    euroAvant: true
  },

  couleurs: {
    fond:      '#f3f1ea',
    fond2:     '#e8e5da',
    accent:    '#d4ff3f',
    texte:     '#0b0c09',
    texteDoux: '#6c6a60'
  },
  polices: { titre: 'Bricolage Grotesque', texte: 'Inter' },
  vitesse: 1
};
</script>

<style>
  @property --n { syntax: '<integer>'; inherits: false; initial-value: 0; }
  .nombre { --n: 0; counter-reset: n var(--n); font-variant-numeric: tabular-nums; }
  .nombre::before { content: counter(n); }

  .menu { position: absolute; inset: 0; display: grid; grid-template-columns: 640px 1fr; gap: 110px; padding: 120px 150px 190px; }

  /* Colonne de gauche : le titre */
  .gauche { display: flex; flex-direction: column; justify-content: center; }
  .sur-titre { font-size: 30px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--texte-doux); }
  .grand-nom {
    margin-top: 18px;
    font-family: var(--police-titre), system-ui, sans-serif;
    font-size: 190px; font-weight: 800; line-height: 0.9; letter-spacing: -0.055em;
    text-transform: lowercase;
  }
  .masque { display: block; overflow: hidden; padding-bottom: 0.06em; }
  .masque > span { display: block; }
  .trait-titre { width: 120px; height: 10px; margin-top: 40px; border-radius: 6px; background: var(--texte); transform-origin: left center; }
  .phrase { margin-top: 36px; font-size: 34px; line-height: 1.35; color: var(--texte-doux); max-width: 560px; }
  .pastille-prix {
    align-self: flex-start;
    margin-top: 44px; padding: 18px 30px;
    border-radius: 999px;
    background: var(--texte); color: var(--accent);
    font-size: 30px; font-weight: 700;
  }

  /* Colonne de droite : la carte */
  .carte { display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .ligne {
    position: relative;
    display: grid; grid-template-columns: auto 1fr auto; align-items: end; gap: 26px;
    padding: 26px 34px;
    border-radius: 28px;
  }
  .ligne-fond { position: absolute; inset: 0; border-radius: 28px; background: var(--accent); transform-origin: left center; }
  .ligne > *:not(.ligne-fond) { position: relative; }
  .ligne-nom { font-family: var(--police-titre), system-ui, sans-serif; font-size: 54px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
  .ligne-detail { display: block; margin-top: 10px; font-family: var(--police-texte), system-ui, sans-serif; font-size: 24px; font-weight: 400; letter-spacing: 0; color: var(--texte-doux); }
  .pointilles { height: 4px; margin-bottom: 18px; background: radial-gradient(circle, var(--texte) 2px, transparent 2.5px) 0 0 / 16px 4px repeat-x; opacity: 0.35; transform-origin: left center; }
  .ligne-prix { font-family: var(--police-titre), system-ui, sans-serif; font-size: 58px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; }
  .ligne-prix small { font-size: 26px; font-weight: 600; color: var(--texte-doux); margin-right: 8px; }

  /* Bandeau qui défile en bas */
  .bandeau { position: absolute; left: 0; right: 0; bottom: 0; height: 110px; overflow: hidden; background: var(--texte); color: var(--fond); display: flex; align-items: center; }
  .bandeau-piste { display: flex; flex: none; white-space: nowrap; font-size: 34px; font-weight: 700; }
  .bandeau-piste span { padding: 0 34px; }
  .bandeau-piste i { color: var(--accent); font-style: normal; }
</style>
</head>
<body>

<script src="commun/symboles.js"></script>
<script src="commun/moteur.js"></script>
<script>
/* =======================================================
   🎬  L'ANIMATION — 13 secondes
   ======================================================= */
function construire(scene, R, S) {
  const menu = S.creer('div', 'menu', scene);
  const entrer = (el, t, dy) => S.anim(el, [{ opacity: 0, transform: 'translateY(' + (dy || 30) + 'px)' }, { opacity: 1, transform: 'none' }], t, 0.8, 'douce');

  /* ---------- À gauche : "La carte / novimo" ---------- */
  const gauche = S.creer('div', 'gauche', menu);
  const sur = S.creer('div', 'sur-titre', gauche, R.surTitre);
  entrer(sur, 0.2, 20);
  const nom = S.creer('div', 'grand-nom', gauche);
  const mNom = S.creer('span', 'masque', nom);
  const sNom = S.creer('span', '', mNom, R.marque);
  S.anim(sNom, [{ transform: 'translateY(110%)' }, { transform: 'none' }], 0.35, 0.9, 'douce');
  const trait = S.creer('div', 'trait-titre', gauche);
  S.anim(trait, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], 0.9, 0.7, 'fluide');
  const phrase = S.creer('div', 'phrase', gauche, R.phrase);
  entrer(phrase, 1.1, 24);
  const pastille = S.creer('div', 'pastille-prix', gauche, R.pastille);
  S.anim(pastille, [{ opacity: 0, transform: 'scale(0.6)' }, { opacity: 1, transform: 'scale(1)' }], 8.6, 0.7, 'rebond');

  /* ---------- À droite : la carte, ligne par ligne ---------- */
  const carte = S.creer('div', 'carte', menu);
  const lignes = R.carte.map((p, i) => {
    const ligne = S.creer('div', 'ligne', carte);
    const fond = S.creer('span', 'ligne-fond', ligne);
    const nomP = S.creer('div', 'ligne-nom', ligne, p.nom);
    S.creer('span', 'ligne-detail', nomP, p.detail);
    const points = S.creer('span', 'pointilles', ligne);
    const prix = S.creer('div', 'ligne-prix', ligne);
    prix.innerHTML = (p.des ? '<small>' + R.motDes + '</small>' : '') + (R.euroAvant ? R.devise + '<span class="nombre"></span>' : '<span class="nombre"></span>&nbsp;' + R.devise);

    const t = 1.3 + i * 0.32;
    entrer(nomP, t, 30);
    S.anim(points, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], t + 0.2, 0.8, 'fluide');
    entrer(prix, t + 0.3, 30);
    S.anim(prix.querySelector('.nombre'), [{ '--n': 0 }, { '--n': p.prix }], t + 0.3, 1.3, 'douce');
    return { ligne, fond };
  });

  /* ---------- Le surligneur vert passe sur chaque ligne ---------- */
  lignes.forEach(({ fond }, i) => {
    const t = 4.0 + i * 0.9;
    S.anim(fond, [{ transform: 'scaleX(0)', opacity: 1 }, { transform: 'scaleX(1)', opacity: 1 }], t, 0.45, 'douce');
    // il reste allumé sur la dernière ligne, s'efface sur les autres
    if (i < lignes.length - 1) S.anim(fond, [{ opacity: 1 }, { opacity: 0 }], t + 0.75, 0.3, 'fluide');
  });

  /* ---------- Le bandeau qui défile en bas ---------- */
  const bandeau = S.creer('div', 'bandeau', scene);
  const texte = R.bandeau.map((m) => '<span>' + m + '</span><i>✦</i>').join('');
  const piste1 = S.creer('div', 'bandeau-piste', bandeau);
  piste1.innerHTML = texte + texte;
  const piste2 = S.creer('div', 'bandeau-piste', bandeau);
  piste2.innerHTML = texte + texte;
  S.anim(bandeau, [{ transform: 'translateY(100%)' }, { transform: 'none' }], 2.4, 0.8, 'douce');
  [piste1, piste2].forEach((p) =>
    S.anim(p, [{ transform: 'translateX(0)' }, { transform: 'translateX(-100%)' }], 0, 22, 'lineaire', { iterations: Infinity }));

  S.tenir(13);
}

Studio.demarrer(REGLAGES, construire);
</script>
</body>
</html>
