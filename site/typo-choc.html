<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typo choc</title>
<link rel="stylesheet" href="commun/studio.css">

<!-- =======================================================
     🎛️  RÉGLAGES — style "typo choc" : gros mots qui claquent,
     aplats de couleur qui alternent, bandeaux qui défilent (~11 s)
     ======================================================= -->
<script>
const REGLAGES = {
  titrePage: 'Typo choc — Novimo',
  formats: ['carre', 'vertical', 'paysage'],   // aussi en 16:9 (YouTube, TV)

  marque: 'Novimo',
  slogan: 'Votre marque, en mouvement',

  // Les mots qui claquent un par un (courts, en majuscules)
  mots: ['LOGO.', 'PUB.', 'SPOT.'],

  // La grande annonce, sur deux lignes ( | = retour à la ligne )
  annonce: 'MOITIÉ PRIX | D\'UN PRO',

  // La petite info dans la bulle blanche
  info: 'Devis gratuit en une minute',

  // Le texte qui défile dans les bandeaux (il se répète tout seul)
  bandeau: 'NOVIMO ✦ MOTION DESIGN ✦ ',

  // 🇬🇧 Version anglaise (utilisée sur le site anglais, avec ?langue=en dans l'adresse)
  en: {
    slogan: 'Your brand, in motion',
    mots: ['LOGO.', 'AD.', 'SPOT.'],
    annonce: 'HALF THE PRICE | OF A PRO',
    info: 'Free quote in one minute'
  },

  couleurs: {
    fond:      '#d4ff3f',   // couleur 1 (vert citron Novimo)
    fond2:     '#0b0c09',   // couleur 2 (noir)
    accent:    '#ffffff',   // la bulle d'info
    texte:     '#0b0c09',   // texte posé sur la couleur 1
    texteDoux: '#d4ff3f'    // texte posé sur la couleur 2
  },

  polices: { titre: 'Anton', texte: 'Inter' },
  vitesse: 1
};
</script>

<style>
  .aplat { position: absolute; inset: 0; }
  .aplat.c1 { background: var(--fond); }
  .aplat.c2 { background: var(--fond2); }

  .centre { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .centre > * { grid-area: 1 / 1; }

  .titre-choc {
    font-family: var(--police-titre), Impact, sans-serif;
    text-transform: uppercase;
    line-height: 0.9;
    white-space: nowrap;
    width: max-content;
  }
  .mot-choc { font-size: 300px; }
  #scene.vertical .mot-choc { font-size: 340px; }
  .sur-c1 { color: var(--texte); }
  .sur-c2 { color: var(--texte-doux); }

  .annonce { display: flex; flex-direction: column; align-items: center; }
  .annonce .ligne { display: block; overflow: hidden; padding: 0.14em 10px 0; } /* place pour les accents (É) */
  .annonce .ligne span { display: block; font-size: 220px; }
  #scene.vertical .annonce .ligne span { font-size: 250px; }

  .bulle-info {
    margin-top: 560px;
    padding: 22px 40px;
    border-radius: 999px;
    background: var(--accent);
    color: #111;
    font-size: 36px;
    font-weight: 700;
  }
  #scene.vertical .bulle-info { margin-top: 640px; }

  /* Bandeaux qui défilent */
  .bandeau {
    position: absolute;
    left: -20%; width: 140%;
    height: 120px;
    display: flex; align-items: center;
    overflow: hidden;
    font-family: var(--police-titre), Impact, sans-serif;
    font-size: 64px;
    white-space: nowrap;
  }
  .bandeau.b1 { top: 9%;  background: var(--fond);  color: var(--fond2); transform: rotate(-6deg); }
  .bandeau.b2 { bottom: 9%; background: var(--accent); color: var(--fond2); transform: rotate(5deg); }
  .defile { display: inline-block; padding-left: 0; }

  /* Fin */
  .fin { display: flex; flex-direction: column; align-items: center; }
  .fin-nom { font-size: 210px; color: var(--fond2); }
  #scene.vertical .fin-nom { font-size: 230px; }
  .fin-nom .lettre { transform-origin: 50% 100%; }
  .fin-slogan { margin-top: 26px; font-size: 44px; font-weight: 700; color: var(--fond2); letter-spacing: 0.04em; }
</style>
</head>
<body>

<script src="commun/symboles.js"></script>
<script src="commun/moteur.js"></script>
<script>
/* =======================================================
   🎬  L'ANIMATION
   ======================================================= */
function construire(scene, R, S) {

  // Fond de départ : couleur 1
  S.creer('div', 'aplat c1', scene);

  /* ---------- 1. Les mots qui claquent ----------
     Chaque mot arrive avec un aplat de couleur qui balaie l'écran
     (couleur 1 et couleur 2 en alternance, depuis des côtés différents) */
  const balayages = [
    ['inset(0 100% 0 0)', 'inset(0 0 0 0)'],  // depuis la gauche
    ['inset(0 0 100% 0)', 'inset(0 0 0 0)'],  // depuis le haut
    ['inset(0 0 0 100%)', 'inset(0 0 0 0)'],  // depuis la droite
    ['inset(100% 0 0 0)', 'inset(0 0 0 0)']   // depuis le bas
  ];
  let t = 0.25;
  R.mots.forEach((texte, i) => {
    const sombre = i % 2 === 0;   // 1 mot sur 2 sur fond couleur 2
    const aplat = S.creer('div', 'aplat ' + (sombre ? 'c2' : 'c1'), scene);
    const b = balayages[i % balayages.length];
    S.anim(aplat, [{ clipPath: b[0] }, { clipPath: b[1] }], t, 0.35, 'fluide');

    const centre = S.creer('div', 'centre', scene);
    const mot = S.creer('div', 'titre-choc mot-choc ' + (sombre ? 'sur-c2' : 'sur-c1'), centre, texte);
    S.ajuster(mot, 1000);
    S.anim(mot, [
      { opacity: 0, transform: 'scale(2.6) rotate(-8deg)', filter: 'blur(18px)' },
      { opacity: 1, transform: 'scale(1) rotate(0deg)', filter: 'blur(0px)' }
    ], t + 0.1, 0.45, 'douce');
    // petite secousse à l'impact
    S.anim(mot, [
      { transform: 'translate(0, 0)' }, { transform: 'translate(-10px, 6px)' },
      { transform: 'translate(8px, -4px)' }, { transform: 'translate(0, 0)' }
    ], t + 0.5, 0.2, 'lineaire');
    S.anim(mot, [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(0.7)' }], t + 0.85, 0.18, 'sortie');
    t += 0.95;
  });

  /* ---------- 2. Fond couleur 2 + bandeaux qui défilent ---------- */
  const fond2 = S.creer('div', 'aplat c2', scene);
  S.anim(fond2, [{ clipPath: 'circle(0% at 50% 50%)' }, { clipPath: 'circle(75% at 50% 50%)' }], t, 0.5, 'fluide');

  ['b1', 'b2'].forEach((classe, i) => {
    const bandeau = S.creer('div', 'bandeau ' + classe, scene);
    const defile = S.creer('div', 'defile', bandeau, R.bandeau.repeat(8));
    const angle = i === 0 ? -6 : 5;
    S.anim(bandeau, [
      { transform: 'rotate(' + angle + 'deg) scaleX(0)' },
      { transform: 'rotate(' + angle + 'deg) scaleX(1)' }
    ], t + 0.2 + i * 0.15, 0.6, 'douce');
    // le texte défile en continu (sens opposés)
    S.anim(defile, [
      { transform: 'translateX(' + (i === 0 ? '0%' : '-50%') + ')' },
      { transform: 'translateX(' + (i === 0 ? '-50%' : '0%') + ')' }
    ], 0, 14, 'lineaire', { iterations: Infinity });
  });

  /* ---------- 3. La grande annonce + la bulle d'info ---------- */
  const centre = S.creer('div', 'centre', scene);
  const annonce = S.creer('div', 'annonce titre-choc sur-c2', centre);
  const lignes = R.annonce.split('|').map((txt) => {
    const ligne = S.creer('span', 'ligne', annonce);
    return S.creer('span', '', ligne, txt.trim());
  });
  S.ajuster(annonce, 960, lignes);
  lignes.forEach((l, i) => S.anim(l, [{ transform: 'translateY(150%)' }, { transform: 'translateY(0)' }], t + 0.45 + i * 0.15, 0.7, 'douce'));

  const info = S.creer('div', 'bulle-info', centre, R.info);
  S.ajuster(info, 900);
  S.anim(info, [{ opacity: 0, transform: 'scale(0.4)' }, { opacity: 1, transform: 'scale(1)' }], t + 1.4, 0.6, 'rebond');

  /* ---------- 4. Fin : rond couleur 1 qui envahit l'écran + nom ---------- */
  const tFin = t + 3.4;
  const fondFin = S.creer('div', 'aplat c1', scene);
  S.anim(fondFin, [{ clipPath: 'circle(0% at 50% 50%)' }, { clipPath: 'circle(80% at 50% 50%)' }], tFin, 0.7, 'fluide');

  const centreFin = S.creer('div', 'centre', scene);
  const fin = S.creer('div', 'fin', centreFin);
  const nom = S.creer('div', 'titre-choc fin-nom', fin);
  const lettres = S.lettres(nom, R.marque.toUpperCase());
  const slogan = S.creer('div', 'fin-slogan', fin, R.slogan);
  S.ajuster(nom, 980);
  lettres.forEach((l, i) => S.anim(l, [
    { transform: 'scaleY(0)' }, { transform: 'scaleY(1.15)', offset: 0.7 }, { transform: 'scaleY(1)' }
  ], tFin + 0.45 + i * 0.04, 0.6, 'douce'));
  S.anim(slogan, [{ opacity: 0, transform: 'translateY(30px)' }, { opacity: 1, transform: 'none' }], tFin + 0.9, 0.7, 'douce');

  S.tenir(tFin + 3);
}

Studio.demarrer(REGLAGES, construire);
</script>
</body>
</html>
