<!-- =======================================================
     🎛️  RÉGLAGES : pub verticale "prestations" (9:16, 12 s)
     5 plans calés sur la musique (120 BPM : une coupe toutes les 2,5 s) :
     statistiques → prestations reliées par une accolade → messagerie
     chiffrée et devis validé → bouton d'appel → écran de fin.
     ======================================================= -->
<script>
const REGLAGES = {
  titrePage: 'Pub prestations — Novimo',
  formats: ['vertical'],

  marque: 'novimo',
  slogan: 'Votre marque, en mouvement.',
  appel: 'Demander mon devis',
  site: 'novimo.fr',

  // Plan 1 : les chiffres affichés
  devis: 12,            // "12 devis"
  satisfaction: 99,     // "99 % satisfaction"

  // Plan 2 : les cartes de prix (même ordre que l'affichage)
  prestations: [
    { nom: 'Logo animé', prix: '297 €' },
    { nom: 'Petite pub', prix: '147 €' },
    { nom: 'Spot 30 s', prix: '743 €' }
  ],
  resultat: 'Acompte : seulement 30 %',   // la pilule au bout de l'accolade

  couleurs: { fond: '#0b0c09', fond2: '#14160d', accent: '#d4ff3f', texte: '#f2f0e8', texteDoux: '#a3a59a' },
  polices: { titre: 'Bricolage Grotesque', texte: 'Bricolage Grotesque' },
  vitesse: 1
};
</script>

<style>

  .devis-ok { position: absolute; left: 36px; right: 36px; top: 660px; display: flex; align-items: center; gap: 26px; padding: 30px; border-radius: 40px;

  .devis-ok .coche svg { width: 60px; height: 60px; fill: none; stroke: #0b0c09; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }

  .devis-ok span { display: block; margin-top: 4px; font-size: 30px; color: #c9c7bd; font-weight: 700; }
  .devis-ok .prix { margin-left: auto; font-size: 54px; font-weight: 800; color: var(--accent); letter-spacing: -0.04em; }

  /* ---------- PLAN 4 : l'appel à l'action ---------- */
  .p4-texte { position: absolute; left: 90px; right: 90px; top: 600px; }

    padding: 22px 58px 22px 22px; border-radius: 999px; overflow: hidden; background: var(--accent); color: #0b0c09; font-size: 54px; font-weight: 800; letter-spacing: -0.03em;
    box-shadow: 0 0 0 8px rgba(212,255,63,0.15), 0 0 90px rgba(212,255,63,0.55); }
  .bouton .rond { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; background: #0b0c09; }
  .bouton .rond svg { width: 40px; height: 40px; margin-left: 6px; fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; }
  .bouton .reflet { position: absolute; top: -20px; bottom: -20px; left: 0; width: 160px; transform: skewX(-20deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.75), transparent); }
  .doigt { position: absolute; width: 96px; height: 96px; margin: -48px; border-radius: 50%; background: rgba(242,240,232,0.85); border: 4px solid #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 5; }
  .onde { position: absolute; width: 120px; height: 120px; margin: -60px; border-radius: 50%; border: 5px solid var(--accent); z-index: 4; }
  .confetti { position: absolute; width: 14px; height: 14px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 12px rgba(212,255,63,0.8); z-index: 4; }

  /* ---------- PLAN 5 : la fin ---------- */
  .fin { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; text-align: center; background: radial-gradient(ellipse at 50% 42%, #1a1d10, #0b0c09 62%); }
  .tuile { width: 260px; height: 260px; border-radius: 72px; background: var(--accent); overflow: hidden; box-shadow: 0 0 140px rgba(212,255,63,0.5); }

  .fin-slogan { margin-top: 28px; font-size: 46px; color: #c9c7bd; font-weight: 600; }
  .fin-site { margin-top: 90px; padding: 16px 40px; border-radius: 999px; border: 1.5px solid rgba(212,255,63,0.5); color: var(--accent); font-size: 40px; font-weight: 800; letter-spacing: 0.02em; }

<script src="commun/son.js"></script>
<script src="commun/symboles.js"></script>
<script src="commun/moteur.js"></script>
<script>
const LOGO_SVG = '<svg viewBox="0 0 100 100"><g><path class="logo-n" transform="translate(6 0) skewX(-12) translate(10.6 0)" d="M30 76V24h13l15 27V24h13v52H58L43 49v27z"/></g><path class="logo-vitesse" d="M13 41h11M17 55h8"/></svg>';
// Les icônes des cartes : logo (étoile), petite pub (téléphone), spot (clap)
const ICONES = [
  '<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>',
  '<svg viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 9.5v5l4-2.5z"/></svg>',
  '<svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 9l2-5 16 0-2 5M8 4l-1.5 5M13 4l-1.5 5M18 4l-1.5 5"/></svg>'
];

/* =======================================================
   🎬  5 PLANS, une coupe tous les 5 temps (120 BPM → 2,5 s)
   ======================================================= */
function construire(scene, R, S) {
  const P = { p2: 2.5, p3: 5, p4: 7.5, p5: 10 };
  const FIN = 12;
  const a = S.anim;
  const hasard = S.hasard(7);

  const halo = S.creer('div', 'halo', scene);
  S.creer('div', 'grille', scene);
  a(halo, [{ transform: 'scale(0.8)', opacity: 0.6 }, { transform: 'scale(1.15)', opacity: 1 }], 0, FIN, 'lineaire');
  S.creer('div', 'vignette', scene);

  // Transition : l'ancien plan file vers l'avant, le nouveau arrive de loin, un balayage de lumière passe
  function transition(ancien, nouveau, t) {
    a(ancien, [{ opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(18px)' }], t - 0.12, 0.3, 'sortie');
    a(nouveau, [{ opacity: 0, filter: 'blur(18px)' }, { opacity: 1, filter: 'blur(0px)' }], t, 0.35, 'douce');
    const balai = S.creer('div', 'balai', scene);
    a(balai, [{ transform: 'translateX(0) rotate(18deg)', opacity: 1 }, { transform: 'translateX(2400px) rotate(18deg)', opacity: 1 }], t - 0.14, 0.42, 'fluide');
  }

  /* ======================================================
     PLAN 1 (0 → 2,5 s) : le graphique, la barre centrale s'illumine
     ====================================================== */
  const p1 = S.creer('div', 'plan p1', scene);
  const p1Tete = S.creer('div', 'p1-tete', p1);
  p1Tete.innerHTML = '<div class="surtitre"><span class="point"></span>Novimo · cette semaine</div><div class="titre">Vos demandes<br><span class="accent">décollent.</span></div>';
  const graphe = S.creer('div', 'graphe', p1);
  [0.25, 0.5, 0.75].forEach((y) => { S.creer('div', 'ligne-grille', graphe).style.top = (y * 100) + '%'; });
  S.creer('div', 'base', graphe);
  const hauteurs = [0.36, 0.50, 0.42, 0.62, 0.92, 0.55, 0.70, 0.47, 0.64];
  const barres = hauteurs.map((h, i) => {
    const b = S.creer('div', 'barre' + (i === 4 ? ' vedette' : ''), graphe);
    b.style.left = (i * 102.75) + 'px';
    b.style.height = (h * 760) + 'px';
    return b;
  });
  const bulle = S.creer('div', 'bulle-stat', graphe);
  bulle.style.top = (760 - 0.92 * 760 - 260) + 'px';
  bulle.innerHTML = '<b><span class="nombre" id="nb-devis"></span></b><span>devis reçus</span>';
  const puce = S.creer('div', 'puce-stat', p1);
  puce.innerHTML = '<span class="rond">★</span><span><span class="nombre" id="nb-satis"></span> %</span><span class="doux">satisfaction</span>';

  // la caméra part très près de la barre centrale puis recule doucement
  a(p1, [{ transform: 'scale(1.55) translateY(-60px)' }, { transform: 'scale(1.0) translateY(0)' }], 0, 2.4, 'douce');
  a(p1Tete, [{ opacity: 0, transform: 'translateY(30px)' }, { opacity: 1, transform: 'none' }], 0.15, 0.6, 'douce');
  barres.forEach((b, i) => {
    // les barres poussent du centre vers les bords (la caméra est collée à la barre centrale)
    const t = 0.1 + Math.abs(i - 4) * 0.09;
    a(b, [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], t, 0.7, i === 4 ? 'rebond' : 'douce');
    if (i >= 4) S.son('clic', t);
  });
  // la barre vedette s'allume
  const barreV = barres[4];
  a(barreV, [{ filter: 'brightness(0.35) saturate(0)' }, { filter: 'brightness(1.6) saturate(1)', offset: 0.3 }, { filter: 'brightness(1) saturate(1)' }], 0.95, 0.6, 'douce');
  S.son('ding', 1.0);
  a(bulle, [{ opacity: 0, transform: 'translateY(30px) scale(0.7)' }, { opacity: 1, transform: 'none' }], 1.1, 0.5, 'rebond');
  a(bulle.querySelector('#nb-devis'), [{ '--n': 0 }, { '--n': R.devis }], 1.1, 0.8, 'douce');
  S.son('compteur', 1.1, { duree: 0.6, n: 6 });
  a(puce, [{ opacity: 0, transform: 'translateX(80px)' }, { opacity: 1, transform: 'none' }], 1.55, 0.5, 'douce');
  a(puce.querySelector('#nb-satis'), [{ '--n': 60 }, { '--n': R.satisfaction }], 1.55, 0.7, 'douce');
  S.son('pop', 1.6);

  /* ======================================================
     PLAN 2 (2,5 → 5 s) : les prestations, reliées par une accolade
     ====================================================== */
  const p2 = S.creer('div', 'plan', scene);
  transition(p1, p2, P.p2);
  a(p1, [{ transform: 'scale(1)' }, { transform: 'scale(2.4) translateY(120px)' }], P.p2 - 0.12, 0.3, 'sortie');
  S.son('whoosh', P.p2 - 0.2);
  const p2Tete = S.creer('div', 'p2-tete', p2);
  p2Tete.innerHTML = '<div class="surtitre"><span class="point"></span>Nos prestations phares</div><div class="titre">Choisissez,<br><span class="accent">on anime.</span></div>';
  a(p2, [{ transform: 'scale(1)' }, { transform: 'scale(1.05)' }], P.p2, 2.5, 'lineaire');
  a(p2Tete, [{ transform: 'translateY(40px)' }, { transform: 'none' }], P.p2, 0.5, 'douce');

  const hautPilules = [610, 820, 1030];
  const pilules = R.prestations.map((p, i) => {
    const el = S.creer('div', 'pilule', p2);
    el.style.top = hautPilules[i] + 'px';
    el.innerHTML = '<span class="icone">' + ICONES[i % ICONES.length] + '</span><span class="nom">' + p.nom + '</span><span class="prix">' + p.prix + '</span>';
    return el;
  });
  const notes = [0, 1, 2];
  pilules.forEach((el, i) => {
    const t = P.p2 + 0.25 + i * 0.3;
    const cote = i % 2 === 0 ? -1 : 1;
    a(el, [{ opacity: 0, transform: 'translateX(' + (cote * 260) + 'px) scale(0.9)' }, { opacity: 1, transform: 'none' }], t, 0.55, 'douce');
    a(el.querySelector('.prix'), [{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'none' }], t + 0.15, 0.4, 'douce');
    a(el, [{ borderColor: 'rgba(242,240,232,0.14)', boxShadow: '0 20px 50px rgba(0,0,0,0.45)' },
      { borderColor: 'rgba(212,255,63,0.75)', boxShadow: '0 0 40px rgba(212,255,63,0.3), 0 20px 50px rgba(0,0,0,0.45)' }], t + 0.3, 0.3, 'douce');
    S.son('notif', t + 0.05, { ton: notes[i] });
  });
  // les liens lumineux entre les cartes (un point de lumière descend)
  [0, 1].forEach((i) => {
    const haut = hautPilules[i] + 150;
    const lien = S.creer('div', 'lien', p2);
    lien.style.top = haut + 'px';
    const t = P.p2 + 0.55 + i * 0.3;
    a(lien, [{ transform: 'scaleY(0)', opacity: 0 }, { transform: 'scaleY(1)', opacity: 1 }], t, 0.25, 'douce');
    const pt = S.creer('div', 'lien-point', p2);
    a(pt, [{ top: haut + 'px', opacity: 0 }, { top: haut + 'px', opacity: 1, offset: 0.1 }, { top: (haut + 60) + 'px', opacity: 1, offset: 0.9 }, { top: (haut + 60) + 'px', opacity: 0 }], t, 0.35, 'lineaire');
  });
  // l'accolade se dessine sous les cartes et pointe vers le résultat
  const acc = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  acc.setAttribute('class', 'accolade');
  acc.setAttribute('viewBox', '0 0 1080 1920');
  acc.innerHTML = '<path pathLength="1" stroke-dasharray="1" d="M150 1215 Q150 1290 225 1290 L470 1290 Q540 1290 540 1370"/>' +
                  '<path pathLength="1" stroke-dasharray="1" d="M930 1215 Q930 1290 855 1290 L610 1290 Q540 1290 540 1370"/>';
  p2.appendChild(acc);
  acc.querySelectorAll('path').forEach((p) => a(p, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], P.p2 + 1.25, 0.45, 'fluide'));
  S.son('scintille', P.p2 + 1.25);
  const res = S.creer('div', 'resultat', p2, R.resultat);
  a(res, [{ opacity: 0, transform: 'scale(0.5)' }, { opacity: 1, transform: 'none' }], P.p2 + 1.65, 0.5, 'rebond');
  S.son('badge', P.p2 + 1.65);
  a(res, [{ boxShadow: '0 0 70px rgba(212,255,63,0.5)' }, { boxShadow: '0 0 130px rgba(212,255,63,0.8)' }, { boxShadow: '0 0 70px rgba(212,255,63,0.5)' }], P.p2 + 2.1, 0.4, 'fluide');

  /* ======================================================
     PLAN 3 (5 → 7,5 s) : messagerie chiffrée, devis validé
     ====================================================== */
  const p3 = S.creer('div', 'plan', scene);
  transition(p2, p3, P.p3);
  a(p2, [{ transform: 'scale(1.05)' }, { transform: 'scale(1.6) translateY(-200px)' }], P.p3 - 0.12, 0.3, 'sortie');
  S.son('glisse', P.p3 - 0.15);
  const cadenas = S.creer('div', 'cadenas', p3);
  cadenas.innerHTML = '<svg viewBox="0 0 100 120"><path class="anse" d="M26 58V38a24 24 0 0 1 48 0v20"/><rect class="corps" x="12" y="54" width="76" height="62" rx="16"/><path class="trou" d="M50 74a7 7 0 0 1 4 12.7V98h-8V86.7A7 7 0 0 1 50 74z"/></svg>';
  const securite = S.creer('div', 'securite', p3);
  securite.innerHTML = 'Sécurisé<span class="doux">· Chiffré AES-256</span>';
  const fen = S.creer('div', 'fenetre', p3);
  const tourne = S.creer('div', 'tourne', fen);
  S.creer('div', 'fond-bord', fen);
  const contenu = S.creer('div', 'contenu', fen);
  contenu.innerHTML =
    '<div class="chat-tete"><span class="tuile-mini">' + LOGO_SVG + '</span><div><b>Novimo</b><small><i></i>En ligne · répond vite</small></div><span class="mini-cadenas">🔒 Chiffré</span></div>';
  const m1 = S.creer('div', 'message moi', contenu);
  m1.innerHTML = 'Bonjour ! Un logo animé pour ma boutique, c’est possible ?<small>14:02</small>';
  const m2 = S.creer('div', 'message eux', contenu);
  m2.innerHTML = 'Bien sûr ! Je vous envoie le devis tout de suite 🙌<small>14:03</small>';
  const ok = S.creer('div', 'devis-ok', contenu);
  ok.innerHTML = '<span class="coche"><svg viewBox="0 0 24 24"><path pathLength="1" stroke-dasharray="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><div><b>Devis validé</b><span>' + R.prestations[0].nom + '</span></div><span class="prix">' + R.prestations[0].prix + '</span>';

  a(p3, [{ transform: 'scale(1.12) translateY(60px)' }, { transform: 'scale(1) translateY(0)' }], P.p3, 0.9, 'douce');
  a(tourne, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(720deg)' }], P.p3, 2.6, 'lineaire');
  // le cadenas se ferme
  const anse = cadenas.querySelector('.anse');
  a(cadenas, [{ opacity: 0, transform: 'scale(0.6)' }, { opacity: 1, transform: 'none' }], P.p3 + 0.05, 0.45, 'rebond');
  a(anse, [{ transform: 'translateY(-16px)' }, { transform: 'translateY(-16px)' }], P.p3, 0.3, 'lineaire');
  a(anse, [{ transform: 'translateY(-16px)' }, { transform: 'translateY(0)' }], P.p3 + 0.4, 0.18, 'sortie');
  S.son('tick', P.p3 + 0.55);
  a(securite, [{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'none' }], P.p3 + 0.55, 0.4, 'douce');
  a(fen, [{ opacity: 0, transform: 'translateY(120px)' }, { opacity: 1, transform: 'none' }], P.p3 + 0.1, 0.55, 'douce');
  // les messages
  a(m1, [{ opacity: 0, transform: 'translateY(40px) scale(0.9)' }, { opacity: 1, transform: 'none' }], P.p3 + 0.7, 0.4, 'rebond');
  S.son('envoi', P.p3 + 0.7);
  a(m2, [{ opacity: 0, transform: 'translateY(40px) scale(0.9)' }, { opacity: 1, transform: 'none' }], P.p3 + 1.2, 0.4, 'rebond');
  S.son('recu', P.p3 + 1.2);
  // le devis validé : zoom dessus
  a(ok, [{ opacity: 0, transform: 'translateY(60px) scale(0.85)' }, { opacity: 1, transform: 'none' }], P.p3 + 1.65, 0.5, 'rebond');
  a(ok.querySelector('path'), [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], P.p3 + 1.85, 0.3, 'douce');
  S.son('succes', P.p3 + 1.7);
  a(p3, [{ transform: 'scale(1) translateY(0)' }, { transform: 'scale(1.18) translateY(-330px)' }], P.p3 + 1.65, 0.75, 'douce');

  /* ======================================================
     PLAN 4 (7,5 → 10 s) : le bouton d'appel à l'action
     ====================================================== */
  const p4 = S.creer('div', 'plan', scene);
  transition(p3, p4, P.p4);
  a(p3, [{ transform: 'scale(1.18) translateY(-330px)' }, { transform: 'scale(1.7) translateY(-560px)' }], P.p4 - 0.12, 0.3, 'sortie');
  S.son('aspire', P.p4 - 0.4);
  const lueurBas = S.creer('div', 'lueur-bas', p4);
  const p4Texte = S.creer('div', 'p4-texte', p4);
  p4Texte.innerHTML = '<div class="surtitre"><span class="point"></span>Prêt à vous lancer ?</div><div class="titre">Votre pub<br>dès <span class="accent">147 €.</span></div><p>Logo animé, pub ou spot :<br>on s’occupe de tout.</p>';
  const bouton = S.creer('div', 'bouton', p4);
  bouton.innerHTML = '<span class="rond"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg></span>' + R.appel;
  const reflet = S.creer('span', 'reflet', bouton);

  a(p4Texte.children[0], [{ opacity: 0, transform: 'translateY(30px)' }, { opacity: 1, transform: 'none' }], P.p4 + 0.1, 0.5, 'douce');
  a(p4Texte.children[1], [{ opacity: 0, transform: 'translateY(60px)' }, { opacity: 1, transform: 'none' }], P.p4 + 0.2, 0.6, 'douce');
  a(p4Texte.children[2], [{ opacity: 0, transform: 'translateY(30px)' }, { opacity: 1, transform: 'none' }], P.p4 + 0.45, 0.5, 'douce');
  S.son('flip', P.p4 + 0.2);
  a(lueurBas, [{ opacity: 0, transform: 'scale(0.6)' }, { opacity: 1, transform: 'none' }], P.p4 + 0.6, 0.8, 'douce');
  a(bouton, [{ opacity: 0, transform: 'translateY(260px) scale(0.8)' }, { opacity: 1, transform: 'none' }], P.p4 + 0.7, 0.6, 'rebond');
  S.son('montee', P.p4 + 0.4, { duree: 0.35 });
  S.son('pop', P.p4 + 0.75);
  a(reflet, [{ transform: 'translateX(-200px) skewX(-20deg)' }, { transform: 'translateX(900px) skewX(-20deg)' }], P.p4 + 1.25, 0.55, 'fluide');
  // un doigt vient appuyer sur le bouton
  const doigt = S.creer('div', 'doigt', p4);
  const cx = 540 + 120, cy = 1320 + 74;
  a(doigt, [{ opacity: 0, left: (cx + 200) + 'px', top: (cy + 380) + 'px', transform: 'scale(1)' }, { opacity: 1, left: cx + 'px', top: cy + 'px', transform: 'scale(1)' }], P.p4 + 1.3, 0.45, 'douce');
  a(doigt, [{ transform: 'scale(1)' }, { transform: 'scale(0.82)' }, { transform: 'scale(1)' }], P.p4 + 1.75, 0.22, 'douce');
  a(doigt, [{ opacity: 1 }, { opacity: 0 }], P.p4 + 2.05, 0.25, 'douce');
  a(bouton, [{ transform: 'none' }, { transform: 'scale(0.94)' }, { transform: 'scale(1.06)' }, { transform: 'none' }], P.p4 + 1.75, 0.45, 'douce');
  const onde = S.creer('div', 'onde', p4);
  onde.style.left = cx + 'px'; onde.style.top = cy + 'px';
  a(onde, [{ opacity: 0, transform: 'scale(0.4)' }, { opacity: 1, transform: 'scale(0.6)', offset: 0.1 }, { opacity: 0, transform: 'scale(4)' }], P.p4 + 1.8, 0.6, 'douce');
  S.son('clic', P.p4 + 1.78);
  S.son('caisse', P.p4 + 1.85);
  for (let i = 0; i < 18; i++) {
    const c = S.creer('i', 'confetti', p4);
    c.style.left = '540px'; c.style.top = (cy) + 'px';
    const ang = -Math.PI * (0.1 + hasard() * 0.8), dist = 260 + hasard() * 340;
    a(c, [{ opacity: 0, transform: 'translate(0,0) rotate(0deg)' }, { opacity: 1, transform: 'translate(0,0) rotate(0deg)', offset: 0.05 },
      { opacity: 0, transform: 'translate(' + Math.cos(ang) * dist * 1.4 + 'px,' + Math.sin(ang) * dist + 'px) rotate(' + (hasard() * 540) + 'deg)' }], P.p4 + 1.85 + hasard() * 0.1, 0.7 + hasard() * 0.3, 'douce');
  }

  /* ======================================================
     PLAN 5 (10 → 12 s) : écran de fin
     ====================================================== */
  const fin = S.creer('div', 'fin', scene);
  transition(p4, fin, P.p5);
  a(p4, [{ transform: 'scale(1)' }, { transform: 'scale(0.85)' }], P.p5 - 0.12, 0.3, 'sortie');
  S.son('zoom', P.p5 - 0.3);
  const tuile = S.creer('div', 'tuile', fin);
  tuile.innerHTML = LOGO_SVG;
  const nom = S.creer('div', 'fin-nom', fin);
  const lettres = S.lettres(nom, R.marque);
  const slogan = S.creer('div', 'fin-slogan', fin, R.slogan);
  const site = S.creer('div', 'fin-site', fin, R.site);
  a(tuile, [{ opacity: 0, transform: 'scale(0.2) rotate(-90deg)' }, { opacity: 1, transform: 'none' }], P.p5 + 0.05, 0.75, 'rebond');
  a(tuile.querySelector('g'), [{ opacity: 0, transform: 'translateX(-30px)' }, { opacity: 1, transform: 'none' }], P.p5 + 0.35, 0.45, 'douce');
  a(tuile.querySelector('.logo-vitesse'), [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], P.p5 + 0.5, 0.35, 'douce');
  lettres.forEach((l, i) => a(l, [{ opacity: 0, transform: 'translateY(60px)' }, { opacity: 1, transform: 'none' }], P.p5 + 0.4 + i * 0.05, 0.5, 'douce'));
  a(slogan, [{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'none' }], P.p5 + 0.85, 0.5, 'douce');
  a(site, [{ opacity: 0, transform: 'scale(0.8)' }, { opacity: 1, transform: 'none' }], P.p5 + 1.2, 0.5, 'rebond');
  a(tuile, [{ boxShadow: '0 0 140px rgba(212,255,63,0.5)' }, { boxShadow: '0 0 220px rgba(212,255,63,0.8)' }, { boxShadow: '0 0 140px rgba(212,255,63,0.5)' }], P.p5 + 1.0, 1.0, 'fluide');
  S.son('boum', P.p5 + 0.05);
  S.son('carillon', P.p5 + 0.85);

  /* ---------- 🎵 Le beat : nappe calme au plan 1, la batterie tombe au plan 2 ---------- */
  S.son('musique', 0, { duree: FIN, drop: P.p2 });

  S.tenir(FIN);
}

Studio.demarrer(REGLAGES, construire);
</script>
