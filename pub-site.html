  const tg = T.messages;
  messages.innerHTML = '<h2 class="msg-titre maj">Messa<span class="accent">gerie</span></h2>' +
    '<div class="carte msg-liste"><div class="msg-conv"><b>Nouveau projet</b><span>Logo pour samedi</span></div></div>' +
    '<div class="carte msg-chat"><span class="badge-rapide">⚡ Réponse en 2 min</span>' +
    '<div class="msg-cats"><p>De quoi voulez-vous parler ?</p><div class="chips">' +
    ['Nouveau projet ou devis', 'Personnaliser un modèle', 'Suivi de commande', 'Retouches', 'Paiement'].map((c, i) => '<span class="chip" data-c="' + i + '">' + c + '</span>').join('') +
    '</div></div><div class="msg-fil"></div><div class="msg-ecrire"><div class="zone"><span class="frappe-msg"></span><span class="caret"></span></div><div class="envoyer">↑</div></div></div>';
  a(email, [{ transform: 'none', opacity: 1 }, { transform: 'translate(600px, -500px) scale(0.05)', opacity: 0 }], tg - 0.2, 0.45, 'sortie');
  a(voile, [{ opacity: 1 }, { opacity: 0 }], tg, 0.3, 'douce');
  cacher(devis, tg, 0.01);
  cameraLarge(tg - 0.2, 0.4);
  a(messages, [{ opacity: 1, transform: 'translateY(700px) scale(0.9)' }, { opacity: 1, transform: 'none' }], tg + 0.05, 0.6, 'douce');
  activer('Messages', tg);
  S.son('whoosh', tg - 0.25);
  // Marie choisit la catégorie
  const chip = messages.querySelector('[data-c="0"]');
  bouger(tg + 0.5, 0.7, chip);
  camera(tg + 0.6, 0.8, 1180, 500, 1.25);
  cliquer(tg + 1.3);
  a(chip, [{ borderColor: 'rgba(242,240,232,0.12)', background: 'rgba(0,0,0,0)', color: '#d6d4cb' }, { borderColor: '#d4ff3f', background: 'rgba(212,255,63,0.12)', color: '#d4ff3f' }], tg + 1.3, 0.2, 'douce');
  // elle écrit son message
  bouger(tg + 1.6, 0.5, messages.querySelector('.zone'));
  camera(tg + 1.7, 0.8, 1320, 760, 1.3);
  const zone = messages.querySelector('.frappe-msg');
  const nm = taper(zone, R.messageClient, tg + 2.0, 1.9);
  S.son('clavier', tg + 2.0, { duree: 1.9, n: Math.round(nm / 1.5) });
  bouger(tg + 3.9, 0.4, messages.querySelector('.envoyer'));
  cliquer(tg + 4.35);
  a(messages.querySelector('.zone .caret'), [{ opacity: 1 }, { opacity: 0 }], 0, 0.45, 'lineaire', { iterations: Infinity, direction: 'alternate' });
  a(zone, [{ opacity: 1 }, { opacity: 0 }], tg + 4.4, 0.1, 'sortie');
  const fil = messages.querySelector('.msg-fil');
  const bulleMoi = S.creer('div', 'msg-bulle moi', fil);
  bulleMoi.innerHTML = R.messageClient + '<small>Vous · 14:02</small>';
  a(bulleMoi, [{ opacity: 0, transform: 'translateY(60px) scale(0.8)' }, { opacity: 1, transform: 'none' }], tg + 4.45, 0.45, 'rebond');
  S.son('bloup', tg + 4.45);
  // "Novimo écrit…"
  const points = S.creer('div', 'points', fil);
  points.innerHTML = '<i></i><i></i><i></i>';
  a(points, [{ opacity: 0, transform: 'scale(0.5)' }, { opacity: 1, transform: 'none' }], tg + 5.0, 0.3, 'rebond');
  points.querySelectorAll('i').forEach((p, i) => a(p, [{ transform: 'translateY(0)' }, { transform: 'translateY(-10px)' }, { transform: 'translateY(0)' }], tg + 5.0 + i * 0.12, 0.45, 'fluide', { iterations: 3 }));
  S.son('ecrit', tg + 5.0, { n: 6 });
  a(points, [{ opacity: 1 }, { opacity: 0 }], tg + 6.25, 0.1, 'sortie');
  // la réponse arrive
  const reponse = S.creer('div', 'msg-bulle', fil);
  reponse.innerHTML = R.reponse + '<small>Novimo · 14:04</small>';
  a(reponse, [{ opacity: 0, transform: 'translateY(60px) scale(0.8)' }, { opacity: 1, transform: 'none' }], tg + 6.3, 0.45, 'rebond');
  S.son('recu', tg + 6.3);
  const badgeRapide = messages.querySelector('.badge-rapide');
  camera(tg + 5.6, 0.9, 1320, 620, 1.12);
  a(badgeRapide, [{ opacity: 0, transform: 'scale(0.3) rotate(-12deg)' }, { opacity: 1, transform: 'rotate(-3deg)' }], tg + 6.7, 0.5, 'rebond');
  S.son('badge', tg + 6.75);
  a(curseur, [{ opacity: 1 }, { opacity: 0 }], tg + 6.7, 0.3, 'sortie');
  // on laisse le temps de lire la réponse, puis léger recul
  a(reponse, [{ transform: 'none' }, { transform: 'scale(1.04)' }, { transform: 'none' }], tg + 7.6, 0.7, 'fluide');
  cameraLarge(tg + 8.2, 1.4);

  /* ======================================================
     7. FIN — flash blanc, impact, le logo Novimo
     ====================================================== */
  const tf = T.fin;
  const flash = S.creer('div', 'flash', scene);
  a(flash, [{ opacity: 0 }, { opacity: 0 }], 0, 0.01, 'lineaire');
  a(flash, [{ opacity: 0 }, { opacity: 1, offset: 0.25 }, { opacity: 0 }], tf - 0.15, 0.6, 'douce');
  camera(tf - 0.6, 0.5, 1320, 700, 2.2, 'sortie');
  const fin = S.creer('div', 'fin', scene);
  a(fin, [{ opacity: 0 }, { opacity: 1 }], tf, 0.05, 'lineaire');
  const finLogo = S.creer('div', 'fin-logo', fin);
  const tuile = S.creer('div', 'tuile', finLogo);
  tuile.innerHTML = LOGO_SVG;
  const finNom = S.creer('div', 'fin-nom', finLogo);
  const lettresFin = S.lettres(finNom, 'novimo');
  const slogan = S.creer('div', 'fin-slogan', fin, R.slogan);
  const ligne = S.creer('div', 'fin-ligne', fin);
  ligne.innerHTML = '<span class="plein-accent">Devis gratuit en 1 minute</span><span>Dès 300 €</span><span>Moitié prix d’un freelance</span>';
  const site = S.creer('div', 'fin-site', fin, R.site);
  a(tuile, [{ opacity: 0, transform: 'scale(0.2) rotate(-160deg)' }, { opacity: 1, transform: 'none' }], tf + 0.1, 0.9, 'rebond');
  a(tuile.querySelector('g'), [{ opacity: 0, transform: 'translateX(-30px)' }, { opacity: 1, transform: 'none' }], tf + 0.45, 0.5, 'douce');
  a(tuile.querySelector('.logo-vitesse'), [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], tf + 0.65, 0.4, 'douce');
  lettresFin.forEach((l, i) => a(l, [{ opacity: 0, transform: 'translateX(-60px)' }, { opacity: 1, transform: 'none' }], tf + 0.35 + i * 0.06, 0.6, 'douce'));
  entrer(slogan, tf + 1.0, 24, 0.6);
  ligne.querySelectorAll('span').forEach((s, i) => a(s, [{ opacity: 0, transform: 'translateY(30px) scale(0.9)' }, { opacity: 1, transform: 'none' }], tf + 1.6 + i * 0.2, 0.5, 'rebond'));
  entrer(site, tf + 2.4, 20, 0.6);
  a(tuile, [{ transform: 'none' }, { transform: 'scale(1.06)' }, { transform: 'none' }], tf + 3.2, 0.8, 'fluide', { iterations: 2 });
  S.son('impact', tf - 0.1);
  S.son('succes', tf + 0.7);
  S.son('caisse', tf + 1.8);

  /* ---------- 🎵 Musique de fond (la batterie arrive avec le site) ---------- */
  S.son('musique', 0, { duree: FIN, drop: T.accueil });

  S.tenir(FIN);
}

Studio.demarrer(REGLAGES, construire);
</script>
