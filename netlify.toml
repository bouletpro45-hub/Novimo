# =========================================================
# Réglages d'hébergement Netlify (lu automatiquement à la mise en ligne)
# Dossier publié : motion-design (le site est dans /site, les animations à la racine)
# Netlify sert TOUT en HTTPS et redirige http:// -> https:// tout seul.
# =========================================================
[build]
  publish = "."

# La page d'accueil du domaine = le site Novimo
[[redirects]]
  from = "/"
  to = "/site/"
  status = 301

# Si tu as un nom de domaine : remplace novimo.fr et enlève les # des 4 lignes
# (redirige aussi l'ancienne adresse en http et la version sans www)
# [[redirects]]
#   from = "http://novimo.fr/*"
#   to = "https://www.novimo.fr/:splat"
#   status = 301
#   force = true

# Page 404 personnalisée
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# En-têtes de sécurité, sur toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    # Oblige le navigateur à toujours utiliser HTTPS pendant 2 ans
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "upgrade-insecure-requests"

# CSS et JS gardés 1 jour en cache (change le ?v=… dans les pages pour forcer la mise à jour)
[[headers]]
  for = "/site/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/site/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/site/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
